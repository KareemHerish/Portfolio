    <script>
      // Compatibility shim for browser extensions attempting to intercept window.fetch
      (function() {
        try {
          var originalFetch = window.fetch;
          if (originalFetch) {
            var activeFetch = originalFetch;
            Object.defineProperty(window, 'fetch', {
              get: function() { return activeFetch; },
              set: function(val) { activeFetch = val; },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {}

        window.addEventListener('error', function(event) {
          if (
            (event.filename && (event.filename.indexOf('chrome-extension://') !== -1 || event.filename.indexOf('moz-extension://') !== -1)) ||
            (event.message && (event.message.indexOf('chrome-extension://') !== -1 || event.message.indexOf('Cannot set property fetch') !== -1))
          ) {
            event.preventDefault();
            event.stopPropagation();
            return true;
          }
        }, true);
      })();
    </script>
    <script>
      (function() {
        try {
          var choice = localStorage.getItem('portfolio_theme_choice');
          if (choice === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        } catch (e) {}
      })();
    </script>
